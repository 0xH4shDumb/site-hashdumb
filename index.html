    table(coffre[k].map(e => [cmdLink('cat ' + e.name, e.name), `<span class="${e.lock ? 'am' : ''}">${esc(e.tag)}</span>`])),
  ]);
  const rot13 = s => s.replace(/[a-z]/gi, c => { const b = c <= 'Z' ? 65 : 97; return String.fromCharCode((c.charCodeAt(0) - b + 13) % 26 + b); });

  // ---------- Commandes ----------
  const history = []; let hIdx = 0;
  const WRONG = [
    'raté 🤡', 'toujours raté.', 'même mon chat aurait trouvé 🐈', 't\'es sûr que t\'es hacker ?',
    'non. NON. ❌', 'ça devient gênant là…', `allez, tape ${cmdLink('indice')}, y'a pas de honte 🫣`,
  ];
  const C = {
    help: { d: 'à l\'aide', f: () => {
      if (helpCount++ === 0) { shake(); return [line('non.', 'big comic'), line(`(bon ok, re-tape ${cmdLink('help')})`, 'dim')]; }
      return [
        line('🕹️  commandes (pas toutes, faut chercher un peu) :', 'mut'),
        table(Object.entries(C).filter(([, v]) => v.d).map(([k, v]) => [cmdLink(k), v.d])),
        line('Tab = complétion · ↑/↓ = historique · le souligné est cliquable', 'dim'),
      ];
    }},
    ls:     { d: 'regarder autour', f: a => {
      const all = a.some(x => /^-\w*a/.test(x));
      if (cwd) return coffre ? listCoffre() : [line('🔒 verrouillé', 'err')];
      if (all) { seen.hidden = true; return listRoot(true); }
      return [...listRoot(false), line('(y\'a rien d\'autre ici 👀 enfin… rien de <i>visible</i>)', 'dim')];
    }},
    cd:     { d: 'bouger', f: a => {
      const t = (a[0] || '~').replace(/\/+$/, '').replace(/^~\//, '').replace(/^\.\/(?=.)/, '');
      if (['~', '..', '/', ''].includes(t)) { cwd = ''; return []; }
      if (t === '.coffre-fort') {
        if (!coffre) { shake(); return [line('🔒 ACCÈS REFUSÉ. ce coffre est protégé par un mot de passe.', 'err'), line(`utilise ${cmdLink('unlock')} &lt;motdepasse&gt;`, 'dim')]; }
        cwd = t; return [line('🔓 bienvenue dans le coffre.', 'ac'), ...listCoffre()];
      }
      if (t === 'coffre-fort') return [line('presque ! les dossiers secrets commencent souvent par un truc…', 'am')];
      return [line(`cd: ${esc(t)}: n'existe pas. comme mes devoirs.`, 'err')];
    }},
    cat:    { d: 'lire un fichier', f: a => {
      const f = (a[0] || '').replace(/^\.\/(?=.)/, '').replace(/^~\//, '');
      if (!f) return [line('cat: lire QUOI ? 🙄', 'err')];
      if (f === '/etc/shadow') { seen.shadow = true; return [
        line('root:*:19999:0:99999:7::: <span class="dim">← nope 👀</span>'),
        line(`h4shdumb:${SHADOW_PW}:19999:0:99999:7:::`),
        line('(hmm, ce "hash" a une drôle de tête… il finit par un =)', 'dim'),
      ]; }
      if (f === '/etc/passwd') return [line('root:x:0:0:root:/root:/bin/bash'), line('h4shdumb:x:1000:1000:le boss:/home/h4shdumb:/bin/frites')];
      if (f === 'flag.txt') return [line('HTB{t_as_cru_que_c_etait_si_facile_🤡}', 'pk')];
      if (!cwd && FILES[f]) return FILES[f]();
      const e = cwd && findEntry(f); if (e) return showEntry(e);
      return [line(`cat: ${esc(f)}: introuvable. t'as inventé ce fichier.`, 'err')];
    }},
    rot13:  { d: 'décaler les lettres de 13', f: a => {
      if (!a.length) return [line('usage : rot13 &lt;texte&gt;', 'dim')];
      const r = rot13(a.join(' ')); if (/shadow/.test(r)) seen.rot = true; return [line(esc(r))];
    }},
    base64: { d: 'encoder / décoder (-d)', f: a => {
      const dec = a[0] === '-d', s = (dec ? a.slice(1) : a).join(' ');
      if (!s) return [line('usage : base64 [-d] &lt;texte&gt;', 'dim')];
      try {
        const r = dec ? new TextDecoder().decode(b64dec(s)) : btoa(String.fromCharCode(...new TextEncoder().encode(s)));
        if (dec && s === SHADOW_PW) seen.b64 = true; return [line(esc(r))];
      } catch { return [line('base64: entrée invalide. même pas du base64 ça 🙄', 'err')]; }
    }},
    unlock: { d: 'ouvrir le coffre', f: async a => {
      if (!a.length) return [line('usage : unlock &lt;motdepasse&gt;', 'dim')];
      if (coffre) return [line(`déjà ouvert, champion 🏆 → ${cmdLink('cd .coffre-fort')}`, 'ac')];
      print(line('🔐 vérification…', 'dim'));
      const c = await ouvrir(a.join(' '));
      if (!c) { shake(); addAura(-100); return [line(WRONG[Math.min(fails++, WRONG.length - 1)], 'err comic big')]; }
      coffre = c; cwd = '.coffre-fort';
      try { localStorage.setItem('coffre', a.join(' ')); } catch {}
      confetti(); addAura(1000);
      return [line(''), line('#1 VICTOIRE ROYALE 🏆', 'huge rainbow'), line('🎉 COFFRE OUVERT 🎉', 'big rainbow'),
        line(`GG ! t'es un vrai hacker de 8 ans et demi${fails ? ` (après ${fails} essai${fails > 1 ? 's' : ''} raté${fails > 1 ? 's' : ''}, mais chut)` : ''} 🏆`, 'comic'),
        line(''), ...listCoffre()];
    }},
    open:   { d: 'ouvrir un truc', f: a => {
      if (!coffre) { shake(); return [line('t\'as cru que c\'était aussi facile ? ouvre le coffre d\'abord 🤡', 'err')]; }
      const e = findEntry(a[0]);
      if (!e) return [line(`open: ${esc(a[0] || '?')}: connais pas.`, 'err')];
      window.open(e.url, '_blank', 'noopener'); return [line(`→ c'est parti : ${esc(e.url)}`, 'dim')];
    }},
    indice: { d: 'quand t\'es bloqué 🫣', f: () => [line('💡 ' + (
      coffre ? 'ben… t\'as déjà gagné. va voir le coffre.' :
      !seen.hidden ? `les fichiers timides se cachent derrière un point. essaie ${cmdLink('ls -a')}` :
      !seen.hint ? `y'a un fichier qui dit qu'il est pas un indice. c'est un indice. ${cmdLink('cat .pas_un_indice.txt')}` :
      !seen.rot ? 'César décalait ses lettres. de 13. la commande rot13 existe, je dis ça je dis rien.' :
      !seen.shadow ? 'il t\'a dit où chercher. cat ce fichier là.' :
      !seen.b64 ? 'un "hash" qui finit par = … c\'est du base64. base64 -d' :
      'tu as le mot de passe. unlock &lt;le mot&gt;. allez.'
    ), 'am')] },
    whoami: { d: 'qui t\'es ?', f: () => [line('toi ? un visiteur. 👤'), line('moi ? <b class="ac">0xH4shDumb</b>. étudiant cyber, alternant SOC, pentester en herbe.'), line('mes trucs sont dans le coffre. bonne chance.', 'dim')] },
    hack:   { d: 'hacker la NASA', f: async () => {
      for (const s of ['connexion à nasa.gov…', 'contournement du firewall… ✔', 'injection SQL… ✔', 'téléchargement des aliens… 👽 47%']) { print(line('> ' + s, 'ac')); await sleep(500); }
      shake(); return [line('❌ ANNULÉ : maman a dit non.', 'err big comic')];
    }},
    aura:   { d: 'battle d\'aura ⚔️', f: async () => {
      const opp = pick(['ton prof de maths', 'le chat du voisin', 'un bot Fortnite', 'le mec qui dit "quoicoubeh"', 'ta petite sœur', '0xH4shDumb']);
      print([line(`⚔️  BATTLE D'AURA : <b class="ac">toi</b> vs <b class="pk">${esc(opp)}</b>`, 'big'), line('')]);
      let me = 0, him = 0;
      const MOVES = ['fait un mewing 🤫🧏', 'sort une default dance 🕺', 'dit "tkt" sans expliquer', 'ne cligne pas des yeux 🗿',
        'commande un tasty crousty 🍗', 'fait 6-7 avec les mains 🤲', 'trébuche dans l\'escalier 💀', 'like sa propre story'];
      for (let i = 0; i < 3; i++) {
        await sleep(650);
        const a = Math.round((Math.random() * 1600 - 500) / 10) * 10, b = Math.round((Math.random() * 1600 - 500) / 10) * 10;
        me += a; him += b;
        print([line(`toi ${pick(MOVES)} → <span class="${a >= 0 ? 'ac' : 'err'}">${a >= 0 ? '+' : ''}${a}</span>`),
               line(`${esc(opp)} ${pick(MOVES)} → <span class="${b >= 0 ? 'ac' : 'err'}">${b >= 0 ? '+' : ''}${b}</span>`, 'mut')]);
      }
      await sleep(500);
      if (opp === '0xH4shDumb') { addAura(-9999); return [line(''), line('💀 PERDU. 0xH4shDumb a une aura infinie ♾️. c\'était perdu d\'avance.', 'err big comic')]; }
      addAura(me - him);
      return [line(''), me > him ? line(`🏆 VICTOIRE (${me} vs ${him}). aura farming réussi.`, 'big rainbow') : line(`💀 DÉFAITE (${me} vs ${him}). skill issue.`, 'err big comic')];
    }},
    clear:  { d: 'tout effacer', f: () => { [...out.children].forEach(n => n !== row && n.remove()); return []; } },
    // Commandes cachées (pas dans help)
    67:     { f: async () => {
      document.body.classList.remove('quake'); void document.body.offsetWidth; document.body.classList.add('quake');
      const el = line('', 'huge'); print(el);
      for (let i = 0; i < 8; i++) { el.textContent = i % 2 ? '🫳 6   7 🫴' : '🫴 6   7 🫳'; await sleep(180); }
      el.textContent = 'SIX SEVEEEEN 🤲'; el.classList.add('rainbow'); addAura(67);
      return [];
    }},
    tasty:  { f: async () => {
      confetti(['🍗', '🍟', '🔥', '🌶️', '🍗']);
      const el = line('', 'huge'); print(el);
      for (const t of ['tasty…', 'tasty crousty…', 'TASTY CROUSTY 🍗🔥']) { el.textContent = t; await sleep(450); }
      el.classList.add('rainbow'); addAura(500);
      return [line('🎵 tasty crousty, tasty crousty 🎵', 'comic am')];
    }},
    dance:  { f: async () => { // default dance, version ASCII
      const F = ['  o  \n /|\\ \n / \\ ', ' \\o/ \n  |  \n / \\ ', ' _o  \n  |\\ \n / \\ ', '  o_ \n /|  \n / \\ ', ' \\o  \n  |\\ \n  /> ', '  o/ \n /|  \n <\\  '];
      const el = art('', 'ac big'); print(el);
      for (let i = 0; i < 18; i++) { el.textContent = F[i % F.length]; await sleep(160); }
      addAura(250); return [line('*default dance* 🕺 (le bus de combat 🚌 remercie le conducteur)', 'dim')];
    }},
    // Commandes cachées (suite)
    sudo:   { f: () => [line('[sudo] mot de passe pour visiteur : ********'), line('visiteur n\'est pas dans le fichier sudoers. Cet incident sera signalé à ta maman. 🚨', 'err')] },
    rm:     { f: async a => {
      if (!a.join(' ').includes('-rf')) return [line('rm: non.', 'err')];
      for (const f of ['/bin', '/home', '/etc', '/frites']) { print(line(`suppression de ${f}…`, 'err')); await sleep(300); }
      return [line('…lol non. 🤡 tout est sur le cloud de toute façon.', 'comic big')];
    }},
    exit:   { f: () => { shake(); return [line('tu peux pas partir. personne ne part. 👁️👄👁️', 'comic')]; } },
    pwd:    { f: () => [line(`/home/h4shdumb${cwd ? '/' + cwd : ''} <span class="dim">(dans ma maison 🏠)</span>`)] },
    sl:     { f: async () => { // pour ceux qui tapent sl au lieu de ls
      const train = '      ====        ________\n  _D _|  |_______/        \\__I_I_____\n   |(_)---  |   H\\________/ |   |   \n   /     |  |   H  |  |     |   |   \n  |      |  |   H  |__-----------------\n  | ________|___H__/__|_____/[][]~\\___\n  |/ |   |-----------I_____I [][] []  \n__/ =| o |=-~~\\  /~~\\  /~~\\  /~~\\ ____\n |/-=|___|=    ||    ||    ||    |_____\n  \\_/      \\O=====O=====O=====O_/      ';
      const el = art(train, 'ac'); el.style.overflow = 'hidden'; print(el);
      for (let i = 60; i >= -60; i -= 2) { el.style.textIndent = '0'; el.style.transform = `translateX(${i}ch)`; await sleep(30); }
      el.remove(); return [line('choo choo 🚂 (c\'est ls que tu voulais taper)', 'dim')];
    }},
    cowsay: { f: a => { const t = a.join(' ') || 'meuh'; return [art(` ${'_'.repeat(t.length + 2)}\n< ${t} >\n ${'-'.repeat(t.length + 2)}\n        \\   ^__^\n         \\  (oo)\\_______\n            (__)\\       )\\/\\\n                ||----w |\n                ||     ||`)]; } },
    caca:   { f: () => [line('💩'.repeat(12))] },
    echo:   { f: a => { const t = esc(a.join(' ')); return [line(t), line(t.slice(-4) + '…', 'mut'), line(t.slice(-2) + '…', 'dim')]; } },
    date:   { f: () => [line('l\'heure de manger des frites 🍟')] },
    lock:   { f: () => { coffre = null; cwd = ''; try { localStorage.removeItem('coffre'); } catch {} return [line('🔒 coffre refermé. à toi de rejouer.', 'am')]; } },
  };
  const ALIASES = { '?': 'help', aide: 'help', ll: 'ls', dir: 'ls', cls: 'clear', hint: 'indice', about: 'whoami', quit: 'exit', '💩': 'caca',
    '6-7': '67', 'six-seven': '67', sixseven: '67', crousty: 'tasty', 'tasty-crousty': 'tasty', emote: 'dance', fortnite: 'dance', battle: 'aura' };

  const run = async raw => {
    if (busy) return;
    const input = raw.trim();
    print(line(`${ps1()} ${esc(raw)}`));
    if (!input) return;
    history.push(input); hIdx = history.length;
    const [name, ...args] = input.split(/\s+/);
    const cmd = C[ALIASES[name] || name];
    if (!cmd) {
      shake(); addAura(-10);
      if (/6\s*-?\s*7/.test(input)) print(line('…t\'as dit 6-7 ? 🤲', 'am comic'));
      return print(line(`${esc(name)}: commande introuvable. ${pick(['tu tapes avec tes coudes ?', 'essaie encore 🤡', 'nope.', 'jamais entendu parler.', 'skill issue.'])}`, 'err'));
    }
    busy = true; inp.disabled = true;
    try { print(await cmd.f(args)); }
    finally { busy = false; inp.disabled = false; psEl.innerHTML = ps1(); if (matchMedia('(pointer:fine)').matches) inp.focus({ preventScroll: true }); }
  };

  // ---------- Complétion (n'aide pas pour les fichiers cachés, faut les trouver) ----------
  const complete = v => {
    const parts = v.split(/\s+/), last = parts.pop();
    const pool = parts.length ? [...visible(), ...(seen.hidden ? ['.pas_un_indice.txt', '.coffre-fort/'] : []), ...entries().map(e => e.name)]
                              : Object.keys(C).filter(k => C[k].d);
    const m = pool.filter(k => k.startsWith(last));
    if (m.length === 1) return [...parts, m[0]].join(' ') + (m[0].endsWith('/') ? '' : ' ');
    if (m.length > 1) print([line(`${ps1()} ${esc(v)}`), line(m.join('   '), 'dim')]);
    return v;
  };

  // ---------- Mise en place ----------
  out.innerHTML = '';
  const row = document.createElement('div'); row.className = 'prompt-row';
  const psEl = document.createElement('span'); psEl.innerHTML = ps1();
  const inp = document.createElement('input');
  Object.assign(inp, { id: 'in', type: 'text', autocomplete: 'off', spellcheck: false, autocapitalize: 'off' });
  inp.setAttribute('aria-label', 'Commande du terminal');
  row.append(psEl, inp); out.append(row);

  const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a']; let kIdx = 0;
  addEventListener('keydown', e => {
    kIdx = e.key === KONAMI[kIdx] ? kIdx + 1 : (e.key === KONAMI[0] ? 1 : 0);
    if (kIdx === KONAMI.length) { kIdx = 0; document.body.classList.toggle('disco'); confetti(); addAura(6767); print(line('🕺 MODE DISCO 🪩', 'big rainbow')); }
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const v = inp.value; inp.value = ''; run(v); }
    else if (e.key === 'Tab') { e.preventDefault(); inp.value = complete(inp.value); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (hIdx > 0) inp.value = history[--hIdx]; }
    else if (e.key === 'ArrowDown') { e.preventDefault(); hIdx = Math.min(history.length, hIdx + 1); inp.value = history[hIdx] || ''; }
    else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); C.clear.f(); }
    else if (e.key === 'c' && e.ctrlKey && !getSelection().toString()) { e.preventDefault(); print(line(`${ps1()} ${esc(inp.value)}^C`)); inp.value = ''; }
  });
  out.addEventListener('click', e => { const b = e.target.closest('.cmd'); if (b) run(b.dataset.cmd); });
  term.addEventListener('click', e => { if (!e.target.closest('a,button') && !getSelection().toString()) inp.focus({ preventScroll: true }); });

  // Raccourcis pour mobile (aucun ne donne la solution, évidemment)
  const chips = document.getElementById('chips');
  [['help', true], ['ls'], ['indice'], ['aura'], ['hack']].forEach(([c, primary]) => {
    const b = document.createElement('button'); b.textContent = c; if (primary) b.className = 'primary';
    b.addEventListener('click', () => run(c)); chips.append(b);
  });

  // Console du navigateur, pour les curieux
  console.log('%c👀 tu fouilles dans la console ? respect. mais la réponse est pas ici.', 'font:16px sans-serif;color:#3ddc84');

  // ---------- Écran d'accueil ----------
  (async () => {
    busy = true; inp.disabled = true;
    for (const [s, cls] of [['> démarrage du terminal de ouf…', 'dim'], ['> chargement des frites… ██████████ 100% 🍟', 'dim'], ['> piratage de la NASA… 47% ❌ (maman a dit non)', 'err']]) { print(line(s, cls)); await sleep(450); }
    await sleep(200);
    print([line(''), banner(),
      line('Salut ! 👋 Ici y\'a un <b class="am">coffre-fort</b> 🔐 rempli de trucs secrets.', 'comic'),
      line('Trouve le mot de passe pour l\'ouvrir. Bonne chance (t\'en auras besoin 🤡).', 'comic'),
      line(`Perdu ? tape ${cmdLink('help')}. Vraiment perdu ? ${cmdLink('indice')}.`, 'dim'),
      line('')]);
    let saved = null; try { saved = localStorage.getItem('coffre'); } catch {}
    if (saved && (coffre = await ouvrir(saved))) print([line(`re ! 😎 le coffre est déjà ouvert → ${cmdLink('cd .coffre-fort')}`, 'ac'), line('')]);
    busy = false; inp.disabled = false;
    if (matchMedia('(pointer:fine)').matches) inp.focus({ preventScroll: true });
  })();
})();
</script>
